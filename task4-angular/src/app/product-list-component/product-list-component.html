<div class="container mt-4">
  <div class="row mb-3">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center p-3 bg-light border rounded shadow-sm">
        <h2 class="mb-0">Product List</h2>
        <div>
          <label for="category" class="form-label me-2 mb-0 fw-bold">Choose Category:</label>
          <select id="category" class="form-select d-inline-block w-auto"
                  [(ngModel)]="selectedCategory">
            <option [ngValue]="null">-- All Products --</option>
            <option *ngFor="let cat of categories" [value]="cat">
              {{ cat }}
            </option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <!-- الجدول -->
  <kendo-grid
    [data]="products | categoryFilter: selectedCategory"
    [height]="400"
    [pageSize]="pageSize"
    [skip]="skip"
    [pageable]="true"
    [sortable]="true"
    [resizable]="true"
    [reorderable]="true"
    (dataStateChange)="whenChanged($event)"
  >
    <kendo-grid-column field="id" title="ID" [width]="80"></kendo-grid-column>
    <kendo-grid-column field="name" title="Product Name" [width]="200"></kendo-grid-column>
    <kendo-grid-column field="price" title="Price" filter="numeric" [width]="150">
      <ng-template kendoGridCellTemplate let-dataItem>
        {{ dataItem.price | currency:'USD':'symbol' }}
      </ng-template>
    </kendo-grid-column>
    <kendo-grid-column field="category" title="Category" [width]="200">
      <ng-template kendoGridCellTemplate let-dataItem>
        {{ dataItem.category }}
      </ng-template>
    </kendo-grid-column>
    <kendo-grid-column field="addedDate" title="Added Date" [width]="180">
      <ng-template kendoGridCellTemplate let-dataItem>
        {{ dataItem.addedDate | date:'longDate' }}
      </ng-template>
    </kendo-grid-column>
  </kendo-grid>
</div>
