<div class="container mt-4">
  <div class="row">
    <div class="col-12">
      <h2 class="mb-3">Product List</h2>

      <kendo-grid
        [data]="products"
        [height]="400"
        [pageSize]="pageSize"
        [skip]="skip"
        [pageable]="true"
        [sortable]="true"
        [filterable]="true"
        [resizable]="true"
        [reorderable]="true"
        (dataStateChange)="onStateChange($event)"
      >
        <kendo-grid-column field="id" title="ID" [width]="80"></kendo-grid-column>

        <kendo-grid-column field="name" title="Product Name" [width]="200"></kendo-grid-column>

        <kendo-grid-column field="price" title="Price" filter="numeric" [width]="150">
          <ng-template kendoGridCellTemplate let-dataItem>
            ${{ dataItem.price }}
          </ng-template>
        </kendo-grid-column>

        <kendo-grid-column field="category" title="Category" [width]="150"></kendo-grid-column>
      </kendo-grid>
    </div>
  </div>
</div>
